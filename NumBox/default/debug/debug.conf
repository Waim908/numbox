export writeLog=false
export displayLog=true
export WINEDEBUG="-all"
export BOX64_DYNAREC_LOG=0
export BOX64_LOG=0
export BOX64_TRACE_FILE="/sdcard/NumBox/logs/box64trace.log"
# DXVK_LOG_LEVEL=none|error|warn|info|debug
export DXVK_LOG_LEVEL=none
export DXVK_LOG_PATH="/sdcard/NumBox/logs"
# GST_DEBUG 等级大于等于4才能看到对应的插件调用,wine通常会设置此值为1
# 另外日志等级过高会导致gstreamer视频播放卡顿滞后
export GST_DEBUG=0